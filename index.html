<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Ultimate 3D Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Confetti Library for Victory Particle Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Floating Background Animations -->
    <div class="floating-bg">
        <div class="shape">✊</div>
        <div class="shape">✋</div>
        <div class="shape">✌️</div>
        <div class="shape">✊</div>
        <div class="shape">✋</div>
        <div class="shape">✌️</div>
    </div>

    <!-- Stunning Glowing Header -->
    <header class="main-header">
        <h1>Rock Paper Scissors</h1>
        <p class="subtitle">Ultimate 3D Battle Arena</p>
    </header>

    <main class="game-container">
        <!-- Scoreboard -->
        <div class="score-boad">
            <div class="score-card">
                <p id="You-score">0</p>
                <p class="score-label">You</p>
            </div>
            <div class="score-divider">VS</div>
            <div class="score-card">
                <p id="Comp-score">0</p>
                <p class="score-label">Comp</p>
            </div>
        </div>

        <!-- Interactive Battle Display Area (Shows selected moves with animations) -->
        <div class="battle-arena">
            <div class="battle-box">
                <span class="arena-title">You</span>
                <div id="user-display-move" class="move-display-card">?</div>
            </div>
            <div class="battle-vs">VS</div>
            <div class="battle-box">
                <span class="arena-title">Computer</span>
                <div id="comp-display-move" class="move-display-card">?</div>
            </div>
        </div>

        <!-- Game Message Box -->
        <div class="game-msg">
            <p id="msg">Make your move below!</p>
        </div>

        <!-- Choices Section -->
        <div class="choices">
            <div class="choice" id="rock" title="Rock">
                <img src="rock.png" alt="rock-img">
            </div>
            <div class="choice" id="paper" title="Paper">
                <img src="paper.png" alt="paper-img">
            </div>
            <div class="choice" id="scissors" title="Scissors">
                <img src="scissors.png" alt="scissors-img">
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
